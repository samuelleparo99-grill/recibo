<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will's Grill · Registro diario</title>
<style>
  :root{
    --bg-dark:#1b1310;
    --panel-dark:#241a15;
    --panel-dark-2:#2c2019;
    --line-dark:#3c2c22;
    --flame-orange:#e8551f;
    --flame-orange-hover:#ff6a30;
    --flame-amber:#f2a93b;
    --ember-red:#b23a2e;
    --paper:#fbf3e7;
    --paper-shadow:#e7dac6;
    --ink:#2a211b;
    --ink-soft:#5a4c40;
    --text-light:#f3e9dd;
    --text-muted:#c9b8a8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #3a2216 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, #33200f 0%, transparent 45%),
      var(--bg-dark);
    color:var(--text-light);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .app{max-width:1040px;margin:0 auto;}

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
  }
  .flame-badge{
    width:46px;height:46px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    border-radius:12px;
    background:linear-gradient(160deg,var(--flame-orange),var(--ember-red));
    box-shadow:0 6px 18px rgba(232,85,31,0.35);
  }
  .app-header h1{
    font-family:"Arial Black","Helvetica Neue",sans-serif;
    font-size:22px;
    letter-spacing:-0.3px;
    margin:0;
    line-height:1.15;
  }
  .app-header p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--text-muted);
  }

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--panel-dark);
    border:1px solid var(--line-dark);
    border-radius:var(--radius);
    padding:20px;
  }
  .panel h2{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--flame-amber);
    margin:0 0 16px;
    font-weight:700;
  }

  /* ---------- Form ---------- */
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    background:var(--panel-dark-2);
    border:1px solid var(--line-dark);
    color:var(--text-light);
    border-radius:8px;
    padding:9px 11px;
    font-size:14px;
    font-family:inherit;
  }
  .field input:focus{
    outline:none;
    border-color:var(--flame-orange);
  }
  .field input[type="date"]{
    color-scheme:dark;
  }
  .field input[type="date"]::-webkit-calendar-picker-indicator{
    filter:invert(0.85);
    cursor:pointer;
    opacity:0.9;
  }
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .divider-label{
    display:flex;align-items:center;gap:10px;
    margin:18px 0 12px;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-muted);
  }
  .divider-label::after{
    content:'';flex:1;height:1px;background:var(--line-dark);
  }

  .auto-row{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:7px 0;
    font-size:13.5px;
    border-bottom:1px dashed var(--line-dark);
    font-family:'Courier New',ui-monospace,monospace;
  }
  .auto-row:last-child{border-bottom:none;}
  .auto-row span:first-child{color:var(--text-muted);font-family:inherit;}
  .auto-row.highlight{
    background:rgba(242,169,59,0.1);
    border-radius:8px;
    padding:9px 10px;
    margin-top:6px;
    border-bottom:none;
  }
  .auto-row.highlight span:first-child{color:var(--flame-amber);font-weight:600;}
  .auto-row.highlight span:last-child{color:var(--flame-amber);font-weight:700;font-size:15px;}

  .btn{
    width:100%;
    border:none;
    border-radius:9px;
    padding:12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{
    background:linear-gradient(160deg,var(--flame-orange-hover),var(--flame-orange));
    color:#fff;
    margin-top:16px;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line-dark);
    color:var(--text-muted);
    margin-top:8px;
  }
  .btn-ghost:hover{border-color:var(--flame-orange);color:var(--text-light);}

  /* ---------- History ---------- */
  .empty-state{
    color:var(--text-muted);
    font-size:13.5px;
    padding:30px 10px;
    text-align:center;
    border:1px dashed var(--line-dark);
    border-radius:10px;
  }
  .history-list{display:flex;flex-direction:column;gap:10px;}
  .history-card{
    background:var(--panel-dark-2);
    border:1px solid var(--line-dark);
    border-radius:10px;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .history-card .info h3{
    margin:0 0 3px;
    font-size:15px;
  }
  .history-card .info p{
    margin:0;
    font-size:12.5px;
    color:var(--text-muted);
  }
  .history-card .amounts{
    text-align:right;
    font-family:'Courier New',ui-monospace,monospace;
  }
  .history-card .amounts .total{
    font-size:15px;
    font-weight:700;
    color:var(--flame-amber);
  }
  .history-card .amounts .tip10{
    font-size:12px;
    color:var(--text-muted);
  }
  .history-card .actions{
    display:flex;gap:8px;
    width:100%;
    margin-top:4px;
  }
  .history-card .actions button{
    flex:1;
    padding:8px;
    border-radius:7px;
    font-size:12.5px;
    border:1px solid var(--line-dark);
    background:transparent;
    color:var(--text-light);
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
  }
  .history-card .actions button:hover{border-color:var(--flame-orange);}
  .history-card .actions button.danger:hover{border-color:var(--ember-red);color:#ff8f82;}

  /* ---------- Receipt overlay ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,7,5,0.72);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    z-index:50;
  }
  .overlay.hidden{display:none;}
  .receipt-wrapper{
    max-height:92vh;
    overflow-y:auto;
    display:flex;flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .close-btn{
    align-self:flex-end;
    background:var(--panel-dark-2);
    border:1px solid var(--line-dark);
    color:var(--text-light);
    width:32px;height:32px;
    border-radius:50%;
    cursor:pointer;
    font-size:15px;
  }

  .ticket{
    position:relative;
    width:340px;
    max-width:88vw;
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    padding:26px 22px 20px;
    box-shadow:0 20px 45px rgba(0,0,0,0.45);
    overflow:hidden;
  }
  .ticket::before,.ticket::after{
    content:'';
    position:absolute;left:0;right:0;height:14px;
    background:radial-gradient(circle at 12px 7px, var(--bg-dark) 9px, transparent 9.5px) repeat-x;
    background-size:24px 24px;
  }
  .ticket::before{top:-1px;}
  .ticket::after{bottom:-1px;transform:rotate(180deg);}

  .ticket-watermark{
    position:absolute;
    top:52%;left:50%;
    width:78%;
    transform:translate(-50%,-50%) rotate(-6deg);
    opacity:0.10;
    filter:grayscale(25%);
    pointer-events:none;
    z-index:0;
  }
  .ticket-content{position:relative;z-index:1;}

  .ticket-head{text-align:center;margin-bottom:14px;}
  .ticket-head .icon{font-size:26px;line-height:1;margin-bottom:4px;}
  .ticket-head h3{
    margin:0;
    font-family:"Arial Black","Helvetica Neue",sans-serif;
    font-size:17px;
    letter-spacing:-0.2px;
  }
  .ticket-head .sub{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .ticket-meta{
    font-family:'Courier New',ui-monospace,monospace;
    font-size:12.5px;
    margin-bottom:12px;
  }
  .ticket-meta div{display:flex;justify-content:space-between;margin-bottom:2px;}
  .ticket-meta .k{color:var(--ink-soft);}

  .tdash{
    border:none;
    border-top:1.5px dashed var(--ink-soft);
    opacity:0.45;
    margin:10px 0;
  }

  .tline{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Courier New',ui-monospace,monospace;
    font-size:13px;
    padding:3px 0;
  }
  .tline .lbl{color:var(--ink-soft);}
  .tline .val{font-weight:700;}
  .tline.neg .val{color:var(--ember-red);}
  .tline.total .val, .tline.total .lbl{font-weight:800;font-size:14px;}
  .tline.tip10 .val{color:#8a5a12;}
  .tline.tip10{
    background:rgba(232,85,31,0.10);
    border-radius:6px;padding:6px 8px;margin:4px 0;
  }

  .ticket-foot{
    text-align:center;
    margin-top:14px;
    font-family:'Courier New',ui-monospace,monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .ticket-foot .ref{font-weight:700;color:var(--ink);}

  #shareBtn, #downloadBtn{
    width:340px;max-width:88vw;
  }
  #downloadBtn{margin-top:0;}

  @media (max-width:480px){
    .row-2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="flame-badge">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 2c1 3-2 4-2 7a3 3 0 0 0 6 0c0-1-.5-2-1-2.5.8.2 3 1.8 3 5.5a6 6 0 0 1-12 0c0-4 3-5.5 3.5-8C9.7 3.6 10.8 2.6 12 2z" fill="#fff"/>
      </svg>
    </div>
    <div>
      <h1>Will's Grill</h1>
      <p>Registro de ventas y propinas por día</p>
    </div>
  </div>

  <div class="layout">
    <!-- FORM PANEL -->
    <div class="panel">
      <h2 id="formTitle">Resumen del día</h2>
      <div class="field">
        <label>Nombre de la feria</label>
        <input type="text" id="f_nombre" placeholder="Ej: Staten Island domingo">
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="f_fecha">
      </div>
      <div class="row-2">
        <div class="field">
          <label>Venta cash</label>
          <input type="number" id="f_ventaCash" placeholder="0" min="0" step="1">
        </div>
        <div class="field">
          <label>Venta tarjeta</label>
          <input type="number" id="f_ventaTarjeta" placeholder="0" min="0" step="1">
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label>Tips tarjeta</label>
          <input type="number" id="f_tipsTarjeta" placeholder="0" min="0" step="1">
        </div>
        <div class="field">
          <label>Tips cash</label>
          <input type="number" id="f_tipsCash" placeholder="0" min="0" step="1">
        </div>
      </div>

      <div class="field">
        <label>Tips retenidos</label>
        <input type="number" id="f_tipsRetenidos" placeholder="0" min="0" step="1">
      </div>

      <div class="divider-label">Calculado automáticamente</div>
      <div class="auto-row"><span>Total venta (sin tips)</span><span id="calcTotalVenta">$0</span></div>
      <div class="auto-row"><span>Total propinas (cash + tarjeta)</span><span id="calcTotalPropinas">$0</span></div>
      <div class="auto-row highlight"><span>10% tips tarjeta</span><span id="calcTips10">$0</span></div>

      <button class="btn btn-primary" id="saveBtn">Guardar día</button>
      <button class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Cancelar edición</button>
    </div>

    <!-- HISTORY PANEL -->
    <div class="panel">
      <h2>Historial de días</h2>
      <div id="historyContainer"></div>
    </div>
  </div>
</div>

<!-- RECEIPT OVERLAY -->
<div class="overlay hidden" id="receiptOverlay">
  <div class="receipt-wrapper">
    <button class="close-btn" id="closeReceiptBtn">✕</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  "use strict";

  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  const el = (id) => document.getElementById(id);
  const formInputs = ['f_nombre','f_fecha','f_ventaCash','f_ventaTarjeta','f_tipsTarjeta','f_tipsCash','f_tipsRetenidos'];

  let entries = [];
  let editingId = null;

  function num(v){
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function fmtCOP(n){
    const rounded = Math.round(n);
    return '$' + rounded.toLocaleString('en-US');
  }

  function formatLongDateEs(yyyyMmDd){
    if(!yyyyMmDd) return '';
    const [y,m,d] = yyyyMmDd.split('-').map(Number);
    if(!y||!m||!d) return yyyyMmDd;
    return `${d} de ${MESES[m-1]} de ${y}`;
  }

  function genRef(){
    return 'WG' + Math.floor(1000000 + Math.random()*8999999);
  }

  function computeDerived(entry){
    const totalVenta = num(entry.ventaCash) + num(entry.ventaTarjeta);
    const totalPropinas = num(entry.tipsCash) + num(entry.tipsTarjeta);
    const tips10 = num(entry.tipsTarjeta) * 0.10;
    return { totalVenta, totalPropinas, tips10 };
  }

  // ---------- Storage ----------
  // Works two ways: inside Claude (window.storage) or as a standalone file
  // saved on the phone and opened directly in the browser (localStorage).
  async function storageGet(key){
    if(window.storage && typeof window.storage.get === 'function'){
      try{ return await window.storage.get(key, false); }catch(e){ return null; }
    }
    try{
      const raw = localStorage.getItem(key);
      return raw !== null ? { value: raw } : null;
    }catch(e){ return null; }
  }

  async function storageSet(key, value){
    if(window.storage && typeof window.storage.set === 'function'){
      try{ return await window.storage.set(key, value, false); }catch(e){ return null; }
    }
    try{
      localStorage.setItem(key, value);
      return { value };
    }catch(e){ return null; }
  }

  async function loadEntries(){
    const res = await storageGet('ferias');
    entries = res && res.value ? JSON.parse(res.value) : [];
    renderHistory();
  }

  async function persistEntries(){
    await storageSet('ferias', JSON.stringify(entries));
  }

  // ---------- Form live calc ----------
  function readForm(){
    return {
      nombreFeria: el('f_nombre').value.trim(),
      fecha: el('f_fecha').value,
      ventaCash: num(el('f_ventaCash').value),
      ventaTarjeta: num(el('f_ventaTarjeta').value),
      tipsTarjeta: num(el('f_tipsTarjeta').value),
      tipsCash: num(el('f_tipsCash').value),
      tipsRetenidos: num(el('f_tipsRetenidos').value)
    };
  }

  function updateLiveCalc(){
    const data = readForm();
    const d = computeDerived(data);
    el('calcTotalVenta').textContent = fmtCOP(d.totalVenta);
    el('calcTotalPropinas').textContent = fmtCOP(d.totalPropinas);
    el('calcTips10').textContent = fmtCOP(d.tips10);
  }

  formInputs.forEach(id => el(id).addEventListener('input', updateLiveCalc));

  if(el('f_fecha').showPicker){
    el('f_fecha').addEventListener('click', () => {
      try{ el('f_fecha').showPicker(); }catch(e){}
    });
  }

  // ---------- Save / edit / delete ----------
  function resetForm(){
    formInputs.forEach(id => el(id).value = '');
    el('f_fecha').value = new Date().toISOString().slice(0,10);
    editingId = null;
    el('formTitle').textContent = 'Resumen del día';
    el('cancelEditBtn').style.display = 'none';
    el('saveBtn').textContent = 'Guardar día';
    updateLiveCalc();
  }

  el('saveBtn').addEventListener('click', async () => {
    const data = readForm();
    if(!data.nombreFeria){
      el('f_nombre').focus();
      return;
    }
    let savedId;
    if(editingId){
      const idx = entries.findIndex(e => e.id === editingId);
      if(idx > -1){
        entries[idx] = { ...entries[idx], ...data };
      }
      savedId = editingId;
    } else {
      savedId = 'e_' + Date.now() + '_' + Math.floor(Math.random()*10000);
      entries.unshift({
        id: savedId,
        ref: genRef(),
        createdAt: new Date().toISOString(),
        ...data
      });
    }
    await persistEntries();
    renderHistory();
    resetForm();
    openReceipt(savedId);
  });

  el('cancelEditBtn').addEventListener('click', resetForm);

  function startEdit(id){
    const entry = entries.find(e => e.id === id);
    if(!entry) return;
    editingId = id;
    el('f_nombre').value = entry.nombreFeria;
    el('f_fecha').value = entry.fecha;
    el('f_ventaCash').value = entry.ventaCash;
    el('f_ventaTarjeta').value = entry.ventaTarjeta;
    el('f_tipsTarjeta').value = entry.tipsTarjeta;
    el('f_tipsCash').value = entry.tipsCash;
    el('f_tipsRetenidos').value = entry.tipsRetenidos;
    el('formTitle').textContent = 'Editando día';
    el('saveBtn').textContent = 'Guardar cambios';
    el('cancelEditBtn').style.display = 'block';
    updateLiveCalc();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  async function deleteEntry(id){
    entries = entries.filter(e => e.id !== id);
    await persistEntries();
    renderHistory();
    if(editingId === id) resetForm();
  }

  // ---------- History render ----------
  function renderHistory(){
    const container = el('historyContainer');
    if(entries.length === 0){
      container.innerHTML = '<div class="empty-state">Todavía no has registrado ningún día.<br>Completa el formulario para agregar el primero.</div>';
      return;
    }
    container.innerHTML = '';
    const list = document.createElement('div');
    list.className = 'history-list';
    entries.forEach(entry => {
      const d = computeDerived(entry);
      const card = document.createElement('div');
      card.className = 'history-card';
      card.innerHTML = `
        <div class="info">
          <h3>${escapeHtml(entry.nombreFeria || 'Sin nombre')}</h3>
          <p>${formatLongDateEs(entry.fecha)} · Ref ${entry.ref || ''}</p>
        </div>
        <div class="amounts">
          <div class="total">${fmtCOP(d.totalVenta)}</div>
          <div class="tip10">10% tips: ${fmtCOP(d.tips10)}</div>
        </div>
        <div class="actions">
          <button data-act="view" data-id="${entry.id}">Ver recibo</button>
          <button data-act="edit" data-id="${entry.id}">Editar</button>
          <button data-act="del" data-id="${entry.id}" class="danger">Eliminar</button>
        </div>
      `;
      list.appendChild(card);
    });
    container.appendChild(list);

    container.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const act = btn.getAttribute('data-act');
        if(act === 'view') openReceipt(id);
        else if(act === 'edit') startEdit(id);
        else if(act === 'del') deleteEntry(id);
      });
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- Receipt ----------
  let currentReceiptEntry = null;

  function openReceipt(id){
    const entry = entries.find(e => e.id === id);
    if(!entry) return;
    currentReceiptEntry = entry;
    const d = computeDerived(entry);
    const now = new Date();
    const generadoEl = now.toLocaleString('es-CO', {dateStyle:'long', timeStyle:'short'});

    el('ticketContent').innerHTML = `
      <div class="ticket-head">
        <div class="icon">🔥</div>
        <h3>Will's Grill</h3>
        <div class="sub">Resumen del día</div>
      </div>
      <div class="ticket-meta">
        <div><span class="k">Nombre</span><span>${escapeHtml(entry.nombreFeria || '—')}</span></div>
        <div><span class="k">Fecha</span><span>${formatLongDateEs(entry.fecha)}</span></div>
      </div>
      <hr class="tdash">
      <div class="tline"><span class="lbl">Venta cash</span><span class="val">${fmtCOP(entry.ventaCash)}</span></div>
      <div class="tline"><span class="lbl">Venta tarjeta</span><span class="val">${fmtCOP(entry.ventaTarjeta)}</span></div>
      <hr class="tdash">
      <div class="tline"><span class="lbl">Tips tarjeta</span><span class="val">${fmtCOP(entry.tipsTarjeta)}</span></div>
      <div class="tline"><span class="lbl">Tips cash</span><span class="val">${fmtCOP(entry.tipsCash)}</span></div>
      <div class="tline total"><span class="lbl">Total propinas</span><span class="val">${fmtCOP(d.totalPropinas)}</span></div>
      <div class="tline tip10"><span class="lbl">10% tips tarjeta (auto)</span><span class="val">${fmtCOP(d.tips10)}</span></div>
      <div class="tline"><span class="lbl">Tips retenidos</span><span class="val">${fmtCOP(entry.tipsRetenidos)}</span></div>
      <hr class="tdash">
      <div class="tline total"><span class="lbl">Total venta (sin tips)</span><span class="val">${fmtCOP(d.totalVenta)}</span></div>
      <div class="ticket-foot">
        <div class="ref">Ref: ${entry.ref || ''}</div>
        <div>Generado: ${generadoEl}</div>
      </div>
    `;
    el('receiptOverlay').classList.remove('hidden');
  }

  el('closeReceiptBtn').addEventListener('click', () => {
    el('receiptOverlay').classList.add('hidden');
  });
  el('receiptOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'receiptOverlay') el('receiptOverlay').classList.add('hidden');
  });

  async function renderTicketCanvas(){
    // El recibo vive dentro de un contenedor con scroll (.receipt-wrapper).
    // Si el ticket es más alto que la pantalla, ese scroll recorta lo que
    // html2canvas puede "ver". Por eso, quitamos el límite de alto/scroll
    // justo antes de capturar y lo restauramos después.
    const wrapper = document.querySelector('.receipt-wrapper');
    const prevOverflow = wrapper ? wrapper.style.overflowY : '';
    const prevMaxHeight = wrapper ? wrapper.style.maxHeight : '';
    const prevScrollTop = wrapper ? wrapper.scrollTop : 0;

    if(wrapper){
      wrapper.style.overflowY = 'visible';
      wrapper.style.maxHeight = 'none';
      wrapper.scrollTop = 0;
    }

    try{
      return await window.html2canvas(el('ticketEl'), {
        backgroundColor: null,
        scale: 2,
        useCORS: true
      });
    } finally {
      if(wrapper){
        wrapper.style.overflowY = prevOverflow;
        wrapper.style.maxHeight = prevMaxHeight;
        wrapper.scrollTop = prevScrollTop;
      }
    }
  }

  function canvasToBlob(canvas){
    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  function downloadBlob(blob, filename){
    // Usar un Blob URL (en vez de una data-URL base64 gigante) es mucho
    // más confiable para forzar la descarga en navegadores móviles.
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = filename;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function receiptFileName(){
    const safeName = (currentReceiptEntry.nombreFeria || 'feria')
      .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    return `recibo-${safeName || 'feria'}-${currentReceiptEntry.fecha || ''}.png`;
  }

  function downloadDataUrl(dataUrl, filename){
    const link = document.createElement('a');
    link.download = filename;
    link.href = dataUrl;
    link.click();
  }

  async function withButtonBusy(btn, busyText, fn){
    const original = btn.textContent;
    btn.textContent = busyText;
    btn.disabled = true;
    try{
      await fn();
    }finally{
      btn.textContent = original;
      btn.disabled = false;
    }
  }

  el('downloadBtn').addEventListener('click', async () => {
    if(!window.html2canvas || !currentReceiptEntry) return;
    await withButtonBusy(el('downloadBtn'), 'Generando...', async () => {
      const canvas = await renderTicketCanvas();
      const filename = receiptFileName();
      const blob = await canvasToBlob(canvas);
      if(!blob){
        // Respaldo para navegadores muy antiguos sin soporte de Blob
        downloadDataUrl(canvas.toDataURL('image/png'), filename);
        return;
      }
      downloadBlob(blob, filename);
    });
  });

  el('shareBtn').addEventListener('click', async () => {
    if(!window.html2canvas || !currentReceiptEntry) return;
    await withButtonBusy(el('shareBtn'), 'Generando...', async () => {
      const canvas = await renderTicketCanvas();
      const filename = receiptFileName();

      const blob = await canvasToBlob(canvas);
      if(!blob){
        downloadDataUrl(canvas.toDataURL('image/png'), filename);
        return;
      }

      const file = new File([blob], filename, { type: 'image/png' });
      const canShareFiles = navigator.canShare && navigator.canShare({ files: [file] });

      if (navigator.share && canShareFiles) {
        try{
          await navigator.share({
            files: [file],
            title: "Will's Grill",
            text: `Resumen del día · ${currentReceiptEntry.nombreFeria || ''}`
          });
        }catch(err){
          if(err && err.name !== 'AbortError'){
            downloadBlob(blob, filename);
          }
        }
      } else {
        // Compartir no soportado en este navegador: se descarga la imagen
        downloadBlob(blob, filename);
      }
    });
  });

  // ---------- Init ----------
  resetForm();
  loadEntries();
})();
</script>
</body>
</html>
